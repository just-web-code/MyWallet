name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (JWC)
    runs-on: ubuntu-latest
    env:
      JWC_VERSION: 0.8.2
    steps:
      - uses: actions/checkout@v5

      - name: Install jwc
        run: |
          mkdir -p "${RUNNER_TEMP}/jwc"
          curl -fsSL "https://github.com/Nodirbek-Abdulaxadov/jwc-lang/releases/download/v${JWC_VERSION}/jwc-v${JWC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/jwc"
          sudo install -m 0755 "${RUNNER_TEMP}/jwc/jwc" /usr/local/bin/jwc
          jwc --version

      - name: Validate sources
        run: jwc test

      - name: Lint
        run: jwc lint

      - name: Build
        run: jwc build --release

  client:
    name: Client (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
